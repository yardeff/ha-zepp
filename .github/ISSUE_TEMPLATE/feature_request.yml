name: Feature Request
description: Suggest an enhancement or new feature for the Zepp integration
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement!
        Please review the **[FAQ in README](https://github.com/yarchefis/ha-zepp#frequently-asked-questions-faq)** first.
  - type: textarea
    id: feature_description
    attributes:
      label: Feature Proposal
      description: Describe the feature you would like to see added.
      placeholder: A clear and concise description of what you want to happen...
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Motivation & Use Case
      description: Why would this feature be useful to users?
      placeholder: What problem does this solve for you?
    validations:
      required: true
  - type: checkboxes
    id: limitations_acknowledgement
    attributes:
      label: Scope Acknowledgement
      options:
        - label: I understand that this integration operates via Zepp's cloud APIs as a read-only health telemetry service, and cannot execute two-way hardware control (such as sending push notifications or setting alarms on the watch over Bluetooth).
          required: true
